# Robot preset registry — single source of truth for all known robots.
#
# Each entry captures the *intrinsic identity* of a robot model:
#   - joint_names: ordered list of joint identifiers (lerobot enumeration order)
#   - degrees_mode: True if hardware speaks degrees natively (so we convert to/from rad)
#   - asset: the robot description resource, e.g. URDF or USD
#   - solvers: robot-owned solver definitions built from that asset
#   - action_layout: optional named segments in the policy action vector
#   - chains: (optional) named kinematic chains using joint names, not indices.
#             Auto-derived from joint_names when omitted (keyword matching).
#
# Limits, max velocities, and guard policy live on boundary callbacks in the
# stackfile — never here.
#
# Edit through the Config UI (preset manager) or this file directly.

presets:
  so101_follower:
    joint_names:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll
      - gripper
    degrees_mode: true
    asset:
      type: urdf
      path: assets/so101_new_calib.urdf
    solvers:
      arm_kinematics:
        type: pinocchio_kinematics
        capabilities: [kinematics, fk, ik]
    action_layout:
      - name: arm
        type: joint_position

  franka_emika_panda:
    joint_names:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
      - panda_finger_joint1
      - panda_finger_joint2
    degrees_mode: false
    chains:
      arm:
        joints:
          - panda_joint1
          - panda_joint2
          - panda_joint3
          - panda_joint4
          - panda_joint5
          - panda_joint6
          - panda_joint7
      gripper:
        joints:
          - panda_finger_joint1
          - panda_finger_joint2
