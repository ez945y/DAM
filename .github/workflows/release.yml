name: Release to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # ─── Stage 1: Build dam-rs wheels (Rust extension) ─────────────────────────
  build-rust-wheels:
    name: Build dam-rs (${{ matrix.target }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Linux aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          # macOS Apple Silicon
          - os: macos-14
            target: aarch64-apple-darwin
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels (maturin)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: dam-rust/dam-py
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.11
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-dam-rs-${{ matrix.target }}
          path: dam-rust/dam-py/dist/*.whl

  # ─── Stage 1b: Build dam-rs sdist ─────────────────────────────────────────
  build-rust-sdist:
    name: Build dam-rs sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: dam-rust/dam-py
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-dam-rs-sdist
          path: dam-rust/dam-py/dist/*.tar.gz

  # ─── Stage 2: Build robot-dam (pure Python) ────────────────────────────────
  build-python:
    name: Build robot-dam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install hatchling build

      - name: Build sdist + wheel
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-robot-dam
          path: dist/*

  # ─── Stage 3: Publish dam-rs to PyPI ───────────────────────────────────────
  publish-rust:
    name: Publish dam-rs to PyPI
    needs: [build-rust-wheels, build-rust-sdist]
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-dam-rs-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ─── Stage 4: Publish robot-dam to PyPI ────────────────────────────────────
  # No `environment:` — PyPI bug prevents two pending publishers with same env.
  # robot-dam trusted publisher is set to Environment=(Any).
  # Once both projects exist on PyPI, switch this to environment: pypi.
  publish-python:
    name: Publish robot-dam to PyPI
    needs: [build-python, publish-rust]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-robot-dam
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
