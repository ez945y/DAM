# Minimal Stackfile — the smallest valid DAM configuration.
# Validates with: dam validate examples/stackfiles/minimal.yaml
# Useful as a starting point for building your own Stackfile.

version: "1"

# One guard layer is enough to start
guards:
  - L1: motion

# One boundary: keep joints within safe limits
boundaries:
  safe_joints:
    layer: L1
    type: single
    nodes:
      - callback: joint_position_limits
        params:
          upper: [1.8243, 1.6, 1.5, 1.5, 3.0741, 1.7453]
          lower: [-1.8243, -1.6, -1.6, -1.5, -3.0741, 0.0]

# One task that activates the boundary
tasks:
  default:
    description: "Minimal safety check"
    boundaries:
      - safe_joints

# Sensible defaults
safety:
  control_hz: 30
  enforcement_mode: enforce
