version: "1"

hardware:
  preset: so101_follower
  sources:
    arm:
      type: motor
      port: /dev/tty.usbmodem5AA90244141
      id: my_awesome_follower_arm
    top:
      type: opencv
      index_or_path: 0
      width: 640
      height: 480
      fps: 30
    wrist:
      type: opencv
      index_or_path: 1
      width: 640
      height: 480
      fps: 30
    current:
      type: current
      ref: arm
    temperature:
      type: temperature
      ref: arm
  sinks:
    command:
      ref: sources.arm

policy:
  type: act
  pretrained_path: MikeChenYZ/act-soarm-fmb-v2
  device: mps

safety:
  control_frequency_hz: 30
  no_task_behavior: emergency_stop
  enforcement_mode: enforce

fallbacks:
  emergency_stop:
    type: emergency_stop
    severity: 100
  hold_position:
    type: hold_position
    severity: 80
    escalate_to: emergency_stop
  retreat:
    type: retreat
    severity: 60
    params:
      duration_seconds: 3.0
      arrival_tol: 0.01
  slow_down:
    type: slow_down
    severity: 40
    requires_proposal: true
    params:
      scale: 0.5
  wait_and_retry:
    type: wait_and_retry
    severity: 20
    params:
      wait_seconds: 1.0

guards:
  - L0: ood
    phase: 0
  - L1: motion
    phase: 0
  - L2: execution
    phase: 1
  - L3: hardware
    always: true

boundaries:
  ood_welford:
    layer: L0
    type: single
    nodes:
      - callback: ood_welford
        timeout_sec: 1
        fallback: emergency_stop
        params:
          temporal_smoothing_frames: 3
  workspace:
    layer: L1
    type: single
    nodes:
      - callback: workspace
        params:
          bounds: [[-0.4000, 0.4000], [-0.4000, 0.4000], [0.0200, 0.6000]]
  joint_position_limits:
    layer: L1
    type: single
    nodes:
      - callback: joint_position_limits
        params:
          upper: [1.8243, 1.7691, 1.6026, 1.8067, 3.0741, 1.7453]
          lower: [-1.8243, -1.7691, -1.6026, -1.8067, -3.0741, 0]
  joint_velocity_limit:
    layer: L1
    type: single
    nodes:
      - callback: joint_velocity_limit
        params:
          max_velocities: [1.5000, 1.5000, 1.5000, 1.5000, 1.5000, 1.5000]
  temperature_guard:
    layer: L3
    type: single
    nodes:
      - callback: temperature_limit
        fallback: emergency_stop
        params:
          max_temperature_c: 55.0
  current_guard:
    layer: L3
    type: single
    nodes:
      - callback: current_limit
        fallback: emergency_stop
        params:
          max_current_a: 1.5
  hardware_watchdog:
    layer: L3
    type: single
    nodes:
      - callback: hardware_watchdog
        timeout_sec: 0.5
        fallback: emergency_stop
        params:
          max_staleness_ms: 1000

tasks:
  soarm101:
    description: "Default task"
    boundaries: [workspace, joint_position_limits, joint_velocity_limit, temperature_guard, current_guard, hardware_watchdog]

loopback:
  backend: mcap
  output_dir: ./data/robot/sessions
  window_sec: 10
  rotate_mb: 500
  rotate_minutes: 60
  max_queue_depth: 64
  capture_images_on_clamp: true
