version: "1"

hardware:
  preset: so101_follower
  sources:
    arm:
      type: motor
      port: /dev/tty.usbmodem5AA90244141
      id: my_awesome_follower_arm
    top:
      type: opencv
      index_or_path: 0
      width: 640
      height: 480
      fps: 30
    wrist:
      type: opencv
      index_or_path: 1
      width: 640
      height: 480
      fps: 30
    current:
      type: current
      ref: arm
    temperature:
      type: temperature
      ref: arm
  sinks:
    command:
      ref: sources.arm

policy:
  type: act
  pretrained_path: MikeChenYZ/act-soarm-fmb-v2
  device: mps

safety:
  control_frequency_hz: 30
  no_task_behavior: emergency_stop
  enforcement_mode: enforce

fallbacks:
  emergency_stop:
    type: emergency_stop
  hold_position:
    type: hold_position
    escalates_to: emergency_stop

guards:
  - L0: ood
  - L1: motion
  - L2: execution
  - L3: hardware

boundaries:
  ood_welford:
    layer: L0
    type: single
    nodes:
      - callback: ood_welford
        timeout_sec: 1
        fallback: emergency_stop
        params:
          temporal_smoothing_frames: 3
  workspace:
    layer: L1
    type: single
    nodes:
      - callback: workspace
        timeout_sec: 1
        fallback: emergency_stop
        params:
          bounds: [[-0.4000, 0.4000], [-0.4000, 0.4000], [0.0200, 0.6000]]
  joint_position_limits:
    layer: L1
    type: single
    nodes:
      - callback: joint_position_limits
        fallback: emergency_stop
        params:
          upper: [1.8243, 1.7691, 1.6026, 1.8067, 3.0741, 1.7453]
          lower: [-1.8243, -1.7691, -1.6026, -1.8067, -3.0741, 0]
  joint_velocity_limit:
    layer: L1
    type: single
    nodes:
      - callback: joint_velocity_limit
        timeout_sec: 1
        fallback: emergency_stop
        params:
          max_velocities: [1.5000, 1.5000, 1.5000, 1.5000, 1.5000, 1.5000]
  temperature_guard:
    layer: L3
    type: single
    nodes:
      - callback: temperature_limit
        fallback: emergency_stop
        params:
          max_temperature_c: 55.0
  current_guard:
    layer: L3
    type: single
    nodes:
      - callback: current_limit
        fallback: emergency_stop
        params:
          max_current_a: 1.5
  hardware_watchdog:
    layer: L3
    type: single
    nodes:
      - callback: hardware_watchdog
        timeout_sec: 0.5
        fallback: emergency_stop
        params:
          max_staleness_ms: 1000

tasks:
  soarm101:
    description: "Default task"
    boundaries: [workspace, joint_position_limits, joint_velocity_limit, temperature_guard, current_guard, hardware_watchdog]

loopback:
  backend: mcap
  output_dir: ./data/robot/sessions
  window_sec: 10
  pre_event_sec: 10
  rotate_mb: 500
  rotate_minutes: 60
  max_queue_depth: 64
  capture_images_on_clamp: true
