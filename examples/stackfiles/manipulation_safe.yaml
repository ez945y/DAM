# Manipulation safety bundle — human-collaborative desktop arm.
#
# A curated full-stack profile for tabletop pick-and-place near people.
# Layers joint/workspace limits with the collaborative L1 callbacks:
#   - cartesian_velocity_limit : ISO/TS 15066 reduced-speed cap
#   - keep_out_zone            : operator-occupied no-go volume
#   - orientation_limit        : keep a carried payload upright
#
# Runs in simulation out of the box. For full effect of the FK-based
# callbacks (keep_out_zone / orientation_limit / cartesian_velocity_limit),
# set hardware.urdf_path so a kinematics/dynamics context is available;
# without it those callbacks degrade gracefully (pass).
version: "1"

hardware:
  preset: so101_follower
  # urdf_path: ./assets/so101_new_calib.urdf   # uncomment to enable FK/Jacobian callbacks
  sources:
    main:
      type: dataset
      dataset_repo_id: MikeChenYZ/soarm-fmb-v2
      episode: 0
      degrees_mode: true
  sinks:
    main:
      ref: sources.main

policy:
  type: act
  pretrained_path: MikeChenYZ/act-soarm-fmb-v2
  device: cpu

safety:
  control_frequency_hz: 30
  no_task_behavior: emergency_stop
  enforcement_mode: enforce

fallbacks:
  emergency_stop:
    type: emergency_stop
    severity: 100
  hold_position:
    type: hold_position
    severity: 80
    escalate_to: emergency_stop
  retreat:
    type: retreat
    severity: 60
    escalate_to: hold_position
    params:
      duration_seconds: 3.0
      arrival_tol: 0.01
  slow_down:
    type: slow_down
    severity: 40
    requires_proposal: true
    params:
      scale: 0.5
  wait_and_retry:
    type: wait_and_retry
    severity: 20
    params:
      wait_seconds: 1.0

guards:
  - L0: ood
    phase: 0
  - L1: motion
    phase: 0
  - L2: execution
    phase: 1
  - L3: hardware
    always: true

boundaries:
  joint_position_limits:
    layer: L1
    type: single
    nodes:
      - callback: joint_position_limits
        params:
          upper: [1.8243, 1.7691, 1.6026, 1.8067, 3.0741, 1.7453]
          lower: [-1.8243, -1.7691, -1.6026, -1.8067, -3.0741, 0]
  joint_velocity_limit:
    layer: L1
    type: single
    nodes:
      - callback: joint_velocity_limit
        params:
          max_velocities: [1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
  workspace:
    layer: L1
    type: single
    nodes:
      - callback: workspace
        params:
          bounds: [[-0.4, 0.4], [-0.4, 0.4], [0.02, 0.6]]
  cartesian_velocity_limit:
    layer: L1
    type: single
    nodes:
      - callback: cartesian_velocity_limit
        timeout_sec: 1
        fallback: hold_position
        params:
          max_linear_speed: 0.25   # ISO/TS 15066 reduced-speed (m/s)
          max_angular_speed: 1.0   # rad/s
  keep_out_zone:
    layer: L1
    type: single
    nodes:
      - callback: keep_out_zone
        timeout_sec: 1
        fallback: retreat
        params:
          # Operator-side no-go volume (metres, base frame).
          boxes:
            - [[-0.6, -0.2], [-0.4, 0.4], [0.0, 0.8]]
          spheres:
            - [0.0, 0.35, 0.2, 0.15]
  orientation_limit:
    layer: L1
    type: single
    nodes:
      - callback: orientation_limit
        timeout_sec: 1
        fallback: hold_position
        params:
          max_tilt_deg: 35.0       # keep payload within 35° of upright
          reference_axis: [0.0, 0.0, 1.0]
          tool_axis: [0.0, 0.0, 1.0]
  force_limit:
    layer: L3
    type: single
    nodes:
      - callback: check_force_torque_safe
        timeout_sec: 1
        fallback: hold_position
        params:
          max_force_n: 40.0
          max_torque_nm: 8.0
  hardware_watchdog:
    layer: L3
    type: single
    nodes:
      - callback: hardware_watchdog
        timeout_sec: 0.5
        fallback: emergency_stop
        params:
          max_staleness_ms: 1000
  temperature_limit:
    layer: L3
    type: single
    nodes:
      - callback: temperature_limit
        warn_frames: 5
        fallback: slow_down
        params:
          max_temperature_c: 55.0
  current_limit:
    layer: L3
    type: single
    nodes:
      - callback: current_limit
        warn_frames: 3
        fallback: hold_position
        params:
          max_current_a: 1.5
  voltage_limit:
    layer: L3
    type: single
    nodes:
      - callback: voltage_limit
        fallback: emergency_stop
        params:
          min_voltage_v: 6.0
          max_voltage_v: 8.5
  host_health:
    layer: L3
    type: single
    nodes:
      - callback: host_health_limit
        timeout_sec: 0.5
        fallback: slow_down
        params:
          max_cpu_percent: 99.0
          max_memory_percent: 98.0
          max_temperature_c: 95.0
          max_gpu_percent: 99.0
          max_gpu_temperature_c: 95.0

tasks:
  collaborative_pick_place:
    description: "Human-collaborative tabletop pick-and-place"
    boundaries:
      - joint_position_limits
      - joint_velocity_limit
      - workspace
      - cartesian_velocity_limit
      - keep_out_zone
      - orientation_limit
      - force_limit
      - hardware_watchdog
      - temperature_limit
      - current_limit
      - voltage_limit
      - host_health

loopback:
  backend: mcap
  output_dir: ./data/robot/sessions
  window_sec: 10
  rotate_mb: 500
  rotate_minutes: 60
  max_queue_depth: 64
  capture_images_on_clamp: true
