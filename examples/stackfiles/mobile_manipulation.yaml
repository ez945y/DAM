# Mobile manipulation safety bundle.
#
# Extends the collaborative manipulation profile with a base geofence and a
# tighter Cartesian speed cap, for an arm mounted on a mobile base operating
# near people.
#
#   - base_geofence            : keep the mobile base inside an allowed area
#   - cartesian_velocity_limit : tighter 0.15 m/s reduced-speed cap
#   - keep_out_zone            : operator-occupied no-go volume
#   - orientation_limit        : keep a carried payload upright
#
# base_geofence reads the planar (x, y) base pose from
# obs.channels["base_pose"]; on a fixed arm without that channel it passes.
# Set hardware.urdf_path to enable the FK/Jacobian callbacks.
version: "1"

hardware:
  preset: simulation
  # urdf_path: ./assets/so101.urdf
  sources:
    main:
      type: dataset
      dataset_repo_id: MikeChenYZ/soarm-fmb-v2
      episode: 0
      degrees_mode: true
  sinks:
    main:
      ref: sources.main

policy:
  type: act
  pretrained_path: MikeChenYZ/act-soarm-fmb-v2
  device: cpu

safety:
  control_frequency_hz: 30
  no_task_behavior: emergency_stop
  enforcement_mode: enforce

fallbacks:
  emergency_stop:
    type: emergency_stop
  hold_position:
    type: hold_position
    escalates_to: emergency_stop
  safe_retreat:
    type: safe_retreat
    escalates_to: hold_position

guards:
  - L0: ood
  - L1: motion
  - L2: execution
  - L3: hardware

boundaries:
  joint_position_limits:
    layer: L1
    type: single
    nodes:
      - callback: joint_position_limits
        fallback: emergency_stop
        params:
          upper: [1.8243, 1.7691, 1.6026, 1.8067, 3.0741, 1.7453]
          lower: [-1.8243, -1.7691, -1.6026, -1.8067, -3.0741, 0]
  joint_velocity_limit:
    layer: L1
    type: single
    nodes:
      - callback: joint_velocity_limit
        timeout_sec: 1
        fallback: hold_position
        params:
          max_velocities: [1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
  workspace:
    layer: L1
    type: single
    nodes:
      - callback: workspace
        timeout_sec: 1
        fallback: hold_position
        params:
          bounds: [[-0.4, 0.4], [-0.4, 0.4], [0.02, 0.6]]
  cartesian_velocity_limit:
    layer: L1
    type: single
    nodes:
      - callback: cartesian_velocity_limit
        timeout_sec: 1
        fallback: hold_position
        params:
          max_linear_speed: 0.15   # tighter cap while the base may move
          max_angular_speed: 0.8
  base_geofence:
    layer: L1
    type: single
    nodes:
      - callback: base_geofence
        timeout_sec: 1
        fallback: safe_retreat
        params:
          channel: base_pose
          # Allowed operating cell (metres, map frame).
          bounds: [[-2.0, 2.0], [-1.5, 1.5]]
          polygon:
            - [-2.0, -1.5]
            - [2.0, -1.5]
            - [2.0, 1.5]
            - [0.0, 2.2]
            - [-2.0, 1.5]
  keep_out_zone:
    layer: L1
    type: single
    nodes:
      - callback: keep_out_zone
        timeout_sec: 1
        fallback: safe_retreat
        params:
          boxes:
            - [[-0.6, -0.2], [-0.4, 0.4], [0.0, 0.8]]
          spheres:
            - [0.0, 0.35, 0.2, 0.15]
  orientation_limit:
    layer: L1
    type: single
    nodes:
      - callback: orientation_limit
        timeout_sec: 1
        fallback: hold_position
        params:
          max_tilt_deg: 35.0
          reference_axis: [0.0, 0.0, 1.0]
          tool_axis: [0.0, 0.0, 1.0]
  force_limit:
    layer: L3
    type: single
    nodes:
      - callback: check_force_torque_safe
        timeout_sec: 1
        fallback: emergency_stop
        params:
          max_force_n: 40.0
          max_torque_nm: 8.0
  hardware_watchdog:
    layer: L3
    type: single
    nodes:
      - callback: hardware_watchdog
        timeout_sec: 0.5
        fallback: emergency_stop
        params:
          max_staleness_ms: 1000

tasks:
  mobile_pick_place:
    description: "Human-collaborative mobile-base pick-and-place"
    boundaries:
      - joint_position_limits
      - joint_velocity_limit
      - workspace
      - cartesian_velocity_limit
      - base_geofence
      - keep_out_zone
      - orientation_limit
      - force_limit
      - hardware_watchdog

loopback:
  backend: mcap
  output_dir: ./data/robot/sessions
  window_sec: 10
  pre_event_sec: 10
  rotate_mb: 500
  rotate_minutes: 60
  max_queue_depth: 64
  capture_images_on_clamp: true
