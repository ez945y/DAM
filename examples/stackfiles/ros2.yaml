version: "1"

# ROS2 stackfile demonstrating observation channels.
#
# Two flavours of channel, matching ROS2 conventions:
#
#   * `effort` is JointState-derived — no `topic:` line, because effort
#     already arrives in the same sensor_msgs/JointState callback as position
#     and velocity.
#   * `wrench` is its own subscription (geometry_msgs/WrenchStamped); the
#     `topic:` line overrides the adapter default `/wrench`.

hardware:
  preset: so101_follower
  interfaces:
    ros2_joint_state:
      type: ros2
      capabilities: [observe_joints]
      topic: /my_robot/joint_states
    ros2_command:
      type: ros2
      capabilities: [command_joints]
      ref: ros2_joint_state
      topic: /my_robot/cmd
    # Telemetry channels omit `type:` — the key name is the channel type.
    effort:
      capabilities: [robot_telemetry]
      ref: ros2_joint_state
    wrench:
      capabilities: [robot_telemetry]
      ref: ros2_joint_state
      topic: /my_robot/ft_sensor/wrench  # override default /wrench

safety:
  control_hz: 30
  no_task_behavior: emergency_stop
  enforcement_mode: monitor

fallbacks:
  emergency_stop:
    severity: 100
  hold_position:
    severity: 80
    escalate_to: emergency_stop
  retreat:
    severity: 60
    params:
      duration_seconds: 3.0
      arrival_tol: 0.01
  slow_down:
    severity: 40
    requires_proposal: true
    params:
      scale: 0.5
  wait_and_retry:
    severity: 20
    params:
      wait_seconds: 1.0

guards:
  - L1: motion
    phase: 0
    timeout_ms: 20
  - L2: execution
    phase: 1
    timeout_ms: 20
  - L3: hardware
    always: true
    timeout_ms: 30

boundaries:
  workspace:
    layer: L1
    type: single
    nodes:
      - callback: workspace
        params:
          bounds: [[-0.4, 0.4], [-0.4, 0.4], [0.02, 0.6]]
  joint_position_limits:
    layer: L1
    type: single
    nodes:
      - callback: joint_position_limits
        params:
          upper: [1.8243, 1.6, 1.5, 1.5, 3.0741, 1.7453]
          lower: [-1.8243, -1.6, -1.6, -1.5, -3.0741, 0.0]
  joint_velocity_limit:
    layer: L1
    type: single
    nodes:
      - callback: joint_velocity_limit
        params:
          max_velocities: [1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
  task_gripper_sequence:
    layer: L2
    type: list
    nodes:
      - node_id: pick_left
        callback: task_gripper_command_guard
        fallback: hold_position
        params:
          allowed_command: close
          zone: [[-0.175, -0.025], [-0.075, 0.075], [0.075, 0.225]]
      - node_id: transfer_left_to_right
        callback: task_gripper_command_guard
        fallback: hold_position
        params:
          allowed_command: none
      - node_id: place_right
        callback: task_gripper_command_guard
        fallback: hold_position
        params:
          allowed_command: open
          zone: [[0.025, 0.175], [-0.075, 0.075], [0.075, 0.225]]
  hardware_watchdog:
    layer: L3
    type: single
    nodes:
      - callback: hardware_watchdog
        warn_frames: 3
        fallback: emergency_stop
        params:
          max_staleness_ms: 1000
  temperature_limit:
    layer: L3
    type: single
    nodes:
      - callback: temperature_limit
        warn_frames: 5
        fallback: slow_down
        params:
          max_temperature_c: 55
  current_limit:
    layer: L3
    type: single
    nodes:
      - callback: current_limit
        warn_frames: 3
        fallback: hold_position
        params:
          max_current_a: 1.5
  voltage_limit:
    layer: L3
    type: single
    nodes:
      - callback: voltage_limit
        warn_frames: 3
        fallback: emergency_stop
        params:
          min_voltage_v: 10.0
          max_voltage_v: 13.0

tasks:
  default:
    description: "Default task"
    boundaries:
      - workspace
      - joint_position_limits
      - joint_velocity_limit
      - task_gripper_sequence
      - hardware_watchdog
      - temperature_limit
      - current_limit
      - voltage_limit

loopback:
  backend: mcap
  output_dir: ./data/robot/sessions
  window_sec: 10
  rotate_mb: 500
  rotate_minutes: 60
  max_queue_depth: 64
  capture_images_on_clamp: false
