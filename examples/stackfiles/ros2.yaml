version: "1"

# ROS2 stackfile demonstrating per-channel topic overrides.
#
# Pattern: each peer-source declares `type: <channel>` and (optionally)
# `topic: /custom/topic` to redirect the subscription away from the
# ROS2SourceAdapter's default for that channel.  Drop the `topic:` line to
# keep the adapter default.

hardware:
  preset: generic_6dof
  sources:
    ros2_source:
      type: ros2
      joint_topic: /my_robot/joint_states
      ee_topic: /my_robot/tool_pose
    effort:
      type: effort
      ref: ros2_source
      topic: /my_robot/torque_sensor    # override default /joint_effort
    wrench:
      type: wrench
      ref: ros2_source
      topic: /my_robot/ft_sensor/wrench  # override default /wrench
  sinks:
    cmd:
      ref: sources.ros2_source
      topic: /my_robot/cmd

safety:
  control_frequency_hz: 15
  no_task_behavior: emergency_stop
  enforcement_mode: monitor

guards:
  - L1: motion
  - L3: hardware

boundaries: {}

tasks:
  default:
    description: "Default task"
    boundaries: []

loopback:
  backend: mcap
  output_dir: ./data/robot/sessions
  window_sec: 10
  pre_event_sec: 10
  rotate_mb: 500
  rotate_minutes: 60
  max_queue_depth: 64
  capture_images_on_clamp: false
