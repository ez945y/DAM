# Dataset replay with hardware output — guarded playback.
#
# Replays a recorded LeRobot dataset through the full guard pipeline,
# then outputs validated actions to the physical robot. This mode:
#
#   1. Reads observation + action trajectories from a HuggingFace dataset
#   2. Runs actions through the configured motion and hardware guard boundaries
#   3. Sends only validated (possibly clamped) actions to the real arm
#   4. Records dataset replay_* plus live top/wrist camera footage to MCAP
#
# Use cases:
#   - Verify a recorded demonstration is safe before replaying on hardware
#   - Tune guard parameters against known-good trajectories
#   - Test new boundary configurations without re-running inference
#
# The dataset source provides both observations (state) and actions; no
# policy is needed. Guard checking runs at the configured control frequency.
version: "1"

hardware:
  preset: so101_follower
  sources:
    replay:
      type: dataset
      dataset_repo_id: MikeChenYZ/soarm-fmb-v2
      episode: 0
      degrees_mode: true
      # Preserve both recorded and live streams when they share camera names.
      image_namespace: replay
    arm:
      type: motor
      port: /dev/tty.usbmodem5AA90244141
      robot_type: so101_follower
      id: my_awesome_follower_arm
    top:
      type: opencv
      index_or_path: 0
      width: 640
      height: 480
      fps: 30
    wrist:
      type: opencv
      index_or_path: 1
      width: 640
      height: 480
      fps: 30
    current:
      type: current
      ref: arm
    temperature:
      type: temperature
      ref: arm
    voltage:
      type: voltage
      ref: arm
  sinks:
    command:
      ref: sources.arm

safety:
  control_frequency_hz: 30
  no_task_behavior: emergency_stop
  enforcement_mode: enforce

fallbacks:
  emergency_stop:
    type: emergency_stop
    severity: 100
  hold_position:
    type: hold_position
    severity: 80
    escalate_to: emergency_stop
  slow_down:
    type: slow_down
    severity: 40
    requires_proposal: true
    params:
      scale: 0.5

guards:
  - L1: motion
    phase: 0
    timeout_ms: 20
  - L2: execution
    phase: 1
    timeout_ms: 20
  - L3: hardware
    always: true
    timeout_ms: 30

boundaries:
  joint_position_limits:
    layer: L1
    type: single
    nodes:
      - callback: joint_position_limits
        params:
          upper: [1.8243, 1.6, 1.5, 1.5, 3.0741, 1.7453]
          lower: [-1.8243, -1.6, -1.6, -1.5, -3.0741, 0.0]
  joint_velocity_limit:
    layer: L1
    type: single
    nodes:
      - callback: joint_velocity_limit
        params:
          max_velocities: [1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
  workspace:
    layer: L1
    type: single
    nodes:
      - callback: workspace
        params:
          bounds: [[-0.4, 0.4], [-0.4, 0.4], [0.02, 0.6]]
  task_gripper_sequence:
    layer: L2
    type: list
    nodes:
      - node_id: pick_left
        callback: task_gripper_command_guard
        fallback: hold_position
        params:
          allowed_command: close
          zone: [[-0.175, -0.025], [-0.075, 0.075], [0.075, 0.225]]
      - node_id: transfer_left_to_right
        callback: task_gripper_command_guard
        fallback: hold_position
        params:
          allowed_command: none
      - node_id: place_right
        callback: task_gripper_command_guard
        fallback: hold_position
        params:
          allowed_command: open
          zone: [[0.025, 0.175], [-0.075, 0.075], [0.075, 0.225]]
  hardware_watchdog:
    layer: L3
    type: single
    nodes:
      - callback: hardware_watchdog
        warn_frames: 3
        fallback: emergency_stop
        params:
          max_staleness_ms: 1000
  temperature_limit:
    layer: L3
    type: single
    nodes:
      - callback: temperature_limit
        warn_frames: 5
        fallback: slow_down
        params:
          max_temperature_c: 55
  current_limit:
    layer: L3
    type: single
    nodes:
      - callback: current_limit
        warn_frames: 3
        fallback: hold_position
        params:
          max_current_a: 1.5
  voltage_limit:
    layer: L3
    type: single
    nodes:
      - callback: voltage_limit
        warn_frames: 3
        fallback: emergency_stop
        params:
          min_voltage_v: 10.0
          max_voltage_v: 13.0
  host_health:
    layer: L3
    type: single
    nodes:
      - callback: host_health_limit
        warn_frames: 3
        fallback: slow_down
        params:
          max_cpu_percent: 95.0
          max_memory_percent: 95.0

tasks:
  replay_check:
    description: "Guard-checked dataset replay to hardware"
    boundaries:
      - joint_position_limits
      - joint_velocity_limit
      - workspace
      - task_gripper_sequence
      - hardware_watchdog
      - temperature_limit
      - current_limit
      - voltage_limit
      - host_health

loopback:
  backend: mcap
  output_dir: ./data/robot/sessions
  window_sec: 10
  rotate_mb: 500
  rotate_minutes: 60
  max_queue_depth: 64
  capture_images_on_clamp: true
