version: "1"

# SO-ARM101 with ProxSuite-based QP safety filter at L1.
#
# How this differs from `demo.yaml`:
# ----------------------------------
# Same boundaries, same callbacks.  The ONLY difference is two extra
# params (`qp_solver`, `slack_weight`) carried alongside the existing
# `upper`/`lower` on any L1 boundary — MotionGuard reads `qp_solver` from
# the merged config pool and switches its solver.  No special boundary
# type, no marker callback: `qp_solver` is just another param, treated
# uniformly via the merge_policy registry.
#
# `bounds` on the workspace boundary picks up CBF semantics automatically
# when the QP is active (`dynamics` is injected by the runtime).
#
# If proxsuite isn't installed the runtime silently falls back to the
# box-clamp path — this file remains safe to load anywhere.

hardware:
  preset: so101_follower
  sources:
    arm:
      type: lerobot
      port: /dev/tty.usbmodem5AA90244141
      id: my_awesome_follower_arm
  sinks:
    command:
      ref: sources.arm

policy:
  type: act
  pretrained_path: MikeChenYZ/act-soarm-fmb-v2
  device: mps

safety:
  control_frequency_hz: 50
  no_task_behavior: emergency_stop
  enforcement_mode: enforce

guards:
  - L1: motion
  - L3: hardware

boundaries:
  joint_position_limits:
    layer: L1
    type: single
    nodes:
      - callback: joint_position_limits
        fallback: emergency_stop
        params:
          upper: [1.8243, 1.7691, 1.6026, 1.8067, 3.0741, 1.7453]
          lower: [-1.8243, -1.7691, -1.6026, -1.8067, -3.0741, 0]
          # Two-line opt-in to the QP solver.  Drop these to revert to
          # independent box-clamp.
          qp_solver: proxsuite
          slack_weight: 1.0e8

  joint_velocity_limit:
    layer: L1
    type: single
    nodes:
      - callback: joint_velocity_limit
        timeout_sec: 1
        fallback: emergency_stop
        params:
          max_velocities: [1.5, 1.5, 1.5, 1.5, 1.5, 1.5]

  hardware_watchdog:
    layer: L3
    type: single
    nodes:
      - callback: hardware_limit
        timeout_sec: 0.1
        fallback: emergency_stop
        params:
          max_staleness_ms: 1000

tasks:
  soarm101:
    description: "QP-protected motion"
    boundaries: [joint_position_limits, joint_velocity_limit, hardware_watchdog]

loopback:
  backend: mcap
  output_dir: ./data/robot/sessions
  window_sec: 10
  pre_event_sec: 10
  rotate_mb: 500
  rotate_minutes: 60
  max_queue_depth: 64
  capture_images_on_clamp: true
