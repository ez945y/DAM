version: "1"

hardware:
  preset: so101_follower
  interfaces:
    arm:
      type: motor
      capabilities: [observe_joints, command_joints]
      port: /dev/tty.usbmodem5AA90244141
      robot_type: so101_follower
      id: my_awesome_follower_arm
      degrees_mode: true   # SO-101 motors speak degrees; convert to/from rad
    top:
      type: opencv
      capabilities: [image]
      index_or_path: 0
      width: 640
      height: 480
      fps: 30
    wrist:
      type: opencv
      capabilities: [image]
      index_or_path: 1
      width: 640
      height: 480
      fps: 30
    # Telemetry channels omit `type:` — the key name is the channel type;
    # the adapter resolves it from its telemetry registry.
    current:
      capabilities: [robot_telemetry]
      ref: arm
    temperature:
      capabilities: [robot_telemetry]
      ref: arm
    voltage:
      capabilities: [robot_telemetry]
      ref: arm

policy:
  type: act
  pretrained_path: MikeChenYZ/act-soarm-fmb-v2
  device: mps

safety:
  control_hz: 30
  no_task_behavior: emergency_stop
  enforcement_mode: enforce
  # telemetry_hz decimates temperature/current/voltage register reads off the
  # motor bus (hardware IO cadence). Distinct from slow_lane.task_hz, which
  # paces async guard evaluation. Cached snapshots carry telemetry_timestamp.
  telemetry_hz: 5
  # Fast/slow lane split: expensive guards (L0 vision OOD, L2 task logic)
  # run on an async worker at task_hz; the control loop consumes their
  # latest verdict and degrades per stale_action when it ages past
  # max_staleness_ms. Lane assignment defaults by layer (L0/L2 slow,
  # L1/L3 fast); override per guard with 'lane:' in the guards section.
  slow_lane:
    task_hz: 10
    max_staleness_ms: 500
    stale_action: reject   # reject (trigger fallback) | warn (log only)

fallbacks:
  emergency_stop:
    severity: 100
  hold_position:
    severity: 80
    escalate_to: emergency_stop
  retreat:
    severity: 60
    params:
      duration_seconds: 3.0
      arrival_tol: 0.01
  slow_down:
    severity: 40
    requires_proposal: true
    params:
      scale: 0.5
  wait_and_retry:
    severity: 20
    params:
      wait_seconds: 1.0

guards:
  - L0: ood
    phase: 0
    timeout_ms: 50
    # lane: slow  (default for L0 — set 'fast' to force into the control loop)
  - L1: motion
    phase: 0
    timeout_ms: 20
  - L2: execution
    phase: 1
    timeout_ms: 20
  - L3: hardware
    always: true
    timeout_ms: 30

boundaries:
  ood_perception:
    layer: L0
    type: single
    nodes:
      - callback: ood_detector
        fallback: hold_position
        warn_frames: 3
        params:
          backend: normalizing_flow
          ood_model_path: data/ood_models/ood_model.pt
          nll_sigma: 0
          nll_threshold: -524.3279  # EER threshold from exported RQ1 bundle.
          vision_model: mobilenet_v3_large  # Match the default RQ1 exported bundle.
          vision_weight: 0.3
          vision_cameras: [top]
  joint_position_limits:
    layer: L1
    type: single
    nodes:
      - callback: joint_position_limits
        params:
          upper: [1.8243, 1.6, 1.5, 1.5, 3.0741, 1.7453]
          lower: [-1.8243, -1.6, -1.6, -1.5, -3.0741, 0.0]
          slack_weight: 100000000
  joint_velocity_limit:
    layer: L1
    type: single
    nodes:
      - callback: joint_velocity_limit
        params:
          max_velocities: [1.5000, 1.5000, 1.5000, 1.5000, 1.5000, 1.5000]
          slack_weight: 100000000
  joint_acceleration_limit:
    layer: L1
    type: single
    nodes:
      - callback: joint_acceleration_limit
        params:
          max_acceleration: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0]
  workspace:
    layer: L1
    type: single
    nodes:
      - callback: workspace
        params:
          bounds: [[-0.4000, 0.4000], [-0.4000, 0.4000], [0.0200, 0.6000]]
  task_gripper_sequence:
    layer: L2
    type: list
    nodes:
      - node_id: pick_left
        callback: task_gripper_command_guard
        fallback: hold_position
        params:
          allowed_command: close
          zone: [[-0.175, -0.025], [-0.075, 0.075], [0.075, 0.225]]
      - node_id: transfer_left_to_right
        callback: task_gripper_command_guard
        fallback: hold_position
        params:
          allowed_command: none
      - node_id: place_right
        callback: task_gripper_command_guard
        fallback: hold_position
        params:
          allowed_command: open
          zone: [[0.025, 0.175], [-0.075, 0.075], [0.075, 0.225]]
  hardware_watchdog:
    layer: L3
    type: single
    nodes:
      - callback: hardware_watchdog
        warn_frames: 3
        fallback: emergency_stop
        params:
          max_staleness_ms: 1000
  temperature_limit:
    layer: L3
    type: single
    nodes:
      - callback: temperature_limit
        warn_frames: 5
        fallback: slow_down
        params:
          max_temperature_c: 55
  current_limit:
    layer: L3
    type: single
    nodes:
      - callback: current_limit
        warn_frames: 3
        fallback: hold_position
        params:
          max_current_a: 1.5
  voltage_limit:
    layer: L3
    type: single
    nodes:
      - callback: voltage_limit
        warn_frames: 3
        fallback: emergency_stop
        params:
          min_voltage_v: 10.0
          max_voltage_v: 13.0
  host_health:
    layer: L3
    type: single
    nodes:
      - callback: host_health_limit
        warn_frames: 3
        fallback: slow_down
        params:
          max_cpu_percent: 95.0
          max_memory_percent: 95.0

tasks:
  soarm101:
    description: "Safety-filtered motion"
    boundaries:
      - ood_perception
      - workspace
      - joint_position_limits
      - joint_velocity_limit
      - joint_acceleration_limit
      - task_gripper_sequence
      - hardware_watchdog
      - temperature_limit
      - current_limit
      - voltage_limit
      - host_health

loopback:
  backend: mcap
  output_dir: ./data/robot/sessions
  window_sec: 10
  rotate_mb: 500
  rotate_minutes: 60
  max_queue_depth: 64
  capture_images_on_clamp: true
